server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # API 路由 — 转发到 PHP index.php 统一入口
    location /api/ {
        root /var/www/oa-system;
        try_files $uri $uri/ /api/index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/oa-system$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # admin-login.php 兼容
    location = /admin-login.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/oa-system/api/index.php;
        fastcgi_param REQUEST_URI /api/login;
        include fastcgi_params;
    }

    # 前端静态资源（Vite 构建产物）
    location /assets/ {
        alias /var/www/oa-system/public/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 所有其他请求 — SPA 前端（root 指向 dist 目录）
    location / {
        root /var/www/oa-system/public/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.ht {
        deny all;
    }
}
