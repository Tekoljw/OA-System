server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # 请求体大小限制（防止 JSON 炸弹 DoS）
    client_max_body_size 2M;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'" always;

    # 禁止访问隐藏文件和敏感文件（.env, .git, .htaccess 等）
    location ~ /\. {
        deny all;
        return 404;
    }

    # 非入口 PHP 一律拒绝 —— 白名单，不是黑名单。
    #
    # 原先是黑名单，只列了 controllers/ 和 6 个初始化脚本，于是
    # /api/services/AuthService.php、/api/config/database.php 这些都能直接
    # 请求到并被 PHP 执行。眼下它们只定义类、没有输出，看着人畜无害，
    # 但这是运气：任何一个文件将来加一行顶层代码就会被外部触发执行。
    # 更要命的是 try_files 里 $uri 排在最前 —— 一旦 .php 的 location 因为
    # 配置改动没匹配上，nginx 会把这些文件当静态资源原样吐出来，
    # 数据库凭据就跟着源码一起泄露了。
    #
    # 白名单只放行唯一入口 /api/index.php（在下面的 location = 里），
    # 这条负责挡住其余全部。
    location ~ ^/api/.+\.php$ {
        deny all;
        return 404;
    }

    # API 路由 — 转发到 PHP index.php 统一入口
    location /api/ {
        root /var/www/oa-system;
        try_files $uri $uri/ /api/index.php?$query_string;

        # 接口响应绝不允许被 CDN 或浏览器缓存
        add_header Cache-Control "no-store" always;
        # Nginx 的 add_header 不会叠加继承：子 location 一旦声明了自己的 add_header，
        # server 层的全部失效。此处必须重复声明，否则安全头会被缓存头冲掉。
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'" always;


        # 唯一允许执行的 PHP 入口。用精确匹配（=）而不是正则 \.php$：
        # 后者会把 /api/services/*.php 一并转给 PHP 执行
        location = /api/index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/oa-system$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }
    }

    # admin-login.php 兼容
    location = /admin-login.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/oa-system/api/index.php;
        fastcgi_param REQUEST_URI /api/login;
        include fastcgi_params;
    }

    # 前端静态资源（Vite 构建产物，带哈希的 JS/CSS 文件）
    # 使用正则匹配，避免与前端路由 /assets/records 等冲突
    location ~ ^/assets/.+\.(js|css|woff2?|ttf|eot|svg|png|jpg|gif|ico|map)$ {
        root /var/www/oa-system/public/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Nginx 的 add_header 不会叠加继承：子 location 一旦声明了自己的 add_header，
        # server 层的全部失效。此处必须重复声明，否则安全头会被缓存头冲掉。
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'" always;

    }

    # 所有其他请求 — SPA 前端（root 指向 dist 目录）
    location / {
        root /var/www/oa-system/public/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html 是入口，必须每次回源校验。
        # 否则 CDN/浏览器缓存旧 index.html → 指向旧的 JS 哈希 → 部署对用户不可见
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Nginx 的 add_header 不会叠加继承：子 location 一旦声明了自己的 add_header，
        # server 层的全部失效。此处必须重复声明，否则安全头会被缓存头冲掉。
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'" always;

    }

}
