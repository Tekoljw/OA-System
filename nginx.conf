server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # 请求体大小限制（防止 JSON 炸弹 DoS）
    client_max_body_size 2M;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'" always;

    # 禁止访问隐藏文件和敏感文件（.env, .git, .htaccess 等）
    location ~ /\. {
        deny all;
        return 404;
    }

    # 禁止直接访问非入口 PHP 文件（controllers、初始化脚本等）
    location ~ ^/api/controllers/ {
        deny all;
        return 404;
    }
    location ~ ^/api/(db_init|init_test_users|users|assets|currency-types|dashboard-real-data)\.php$ {
        deny all;
        return 404;
    }

    # API 路由 — 转发到 PHP index.php 统一入口
    location /api/ {
        root /var/www/oa-system;
        try_files $uri $uri/ /api/index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/oa-system$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }
    }

    # admin-login.php 兼容
    location = /admin-login.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/oa-system/api/index.php;
        fastcgi_param REQUEST_URI /api/login;
        include fastcgi_params;
    }

    # 前端静态资源（Vite 构建产物，带哈希的 JS/CSS 文件）
    # 使用正则匹配，避免与前端路由 /assets/records 等冲突
    location ~ ^/assets/.+\.(js|css|woff2?|ttf|eot|svg|png|jpg|gif|ico|map)$ {
        root /var/www/oa-system/public/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 所有其他请求 — SPA 前端（root 指向 dist 目录）
    location / {
        root /var/www/oa-system/public/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

}
