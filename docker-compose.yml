version: '3.8'

services:
  # PostgreSQL 数据库（唯一数据库）
  postgres:
    image: postgres:16-alpine
    container_name: oa-system-postgres
    environment:
      POSTGRES_DB: oa_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # 使用者在 UTC+8。此前库与应用都跑 UTC，导致「哪一天」的判断整体偏移 8 小时：
      # 本地时间 0:00-7:59 的记录筛「今天」筛不到、主管每日审批额度早上 8 点才重置、
      # 流水默认日期写成前一天、仪表盘本月本年边界错位。
      # 存量数据由 migration 019 一次性 +8 小时对齐。
      TZ: Asia/Singapore
      PGTZ: Asia/Singapore
    # PGTZ 只作用于本容器内的 psql 客户端；应用是从另一个容器连进来的，
    # 拿到的仍是服务端默认时区（UTC），于是 DEFAULT CURRENT_TIMESTAMP
    # 写入的还是 UTC —— 只设 PGTZ 会造成「psql 里看着是对的、应用写进去
    # 却是错的」这种极难发现的半吊子状态。必须改服务端默认。
    command: postgres -c timezone=Asia/Singapore
    # 仅内网访问，不暴露到宿主机
    # ports:
    #   - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oa-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: oa-system-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD 环境变量必须设置}
    # 仅内网访问，不暴露到宿主机
    # ports:
    #   - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oa-network

  # OA System 主应用
  oa-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oa-system-app
    environment:
      # 服务层测试入口默认关闭。本仓库的 compose 同时用于生产部署，
      # 写死开启会让绕过审批直写账本的入口跟着代码进生产。
      # 本地跑测试时用 docker-compose.override.yml 打开（该文件不进版本库）。
      OA_ENABLE_TEST_HARNESS: "${OA_ENABLE_TEST_HARNESS:-0}"
      # 与 postgres 保持同一时区，否则 PHP 的 date() 和库里的 now() 会差 8 小时
      TZ: Asia/Singapore
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: oa_system
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 环境变量必须设置}
    ports:
      - "8000:80"
      # PHP-FPM 仅内部使用，不暴露
      # - "8001:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/var/www/oa-system/api
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - oa-network

networks:
  oa-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
