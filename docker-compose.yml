version: '3.8'

services:
  # PostgreSQL 数据库（唯一数据库）
  postgres:
    image: postgres:16-alpine
    container_name: oa-system-postgres
    environment:
      POSTGRES_DB: oa_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oa-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: oa-system-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oa-network

  # OA System 主应用
  oa-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oa-system-app
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: oa_system
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-oa_system_jwt_secret_2026}
    ports:
      - "8000:80"
      - "8001:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/var/www/oa-system/api
      - ./public:/var/www/oa-system/public
    networks:
      - oa-network

networks:
  oa-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
